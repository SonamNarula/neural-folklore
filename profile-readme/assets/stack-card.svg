<svg xmlns="http://www.w3.org/2000/svg" width="560" height="380" viewBox="0 0 560 380" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
    .terminal {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }
    .window-bg {
      fill: #1a1b26;
      stroke: #383e5a;
      stroke-width: 1.5;
      rx: 10px;
    }
    .title-bar {
      fill: #16161e;
      stroke: #383e5a;
      stroke-width: 1.5;
      rx: 10px;
    }
    .dot-red { fill: #f7768e; }
    .dot-yellow { fill: #e0af68; }
    .dot-green { fill: #9ece6a; }
    
    .text-title { fill: #a9b1d6; font-size: 13px; font-weight: 500; }
    .text-prompt { fill: #7dcfff; font-size: 14px; font-weight: 500; }
    .text-cmd { fill: #7aa2f7; font-size: 14px; font-weight: 500; }
    
    .section-title { font-weight: 700; font-size: 12px; }
    .title-lang { fill: #7aa2f7; }
    .title-ml { fill: #ff9e64; }
    .title-web { fill: #9ece6a; }
    .title-dev { fill: #bb9af7; }
    
    .tag-bg { fill: #16161e; stroke: #383e5a; stroke-width: 1; rx: 4px; }
    .tag-text { fill: #c0caf5; font-size: 11px; font-weight: 500; }
    
    /* Small status lights */
    .light { rx: 3px; ry: 3px; }
    .light-blue { fill: #7aa2f7; }
    .light-orange { fill: #ff9e64; }
    .light-green { fill: #9ece6a; }
    .light-purple { fill: #bb9af7; }
  </style>

  <!-- Background Card -->
  <rect x="1.5" y="1.5" width="557" height="377" class="terminal window-bg" />
  
  <!-- Title Bar -->
  <path d="M 1.5,11.5 A 10,10 0 0 1 11.5,1.5 L 548.5,1.5 A 10,10 0 0 1 558.5,11.5 L 558.5,38 L 1.5,38 Z" class="terminal title-bar" />
  
  <!-- Window Controls -->
  <circle cx="20" cy="19" r="6" class="dot-red" />
  <circle cx="40" cy="19" r="6" class="dot-yellow" />
  <circle cx="60" cy="19" r="6" class="dot-green" />
  
  <!-- Window Title -->
  <text x="280" y="24" text-anchor="middle" class="terminal text-title">sonam@github: ~</text>

  <!-- Content -->
  <g class="terminal" transform="translate(25, 65)">
    <!-- Command Prompt -->
    <text x="0" y="10" class="text-prompt">sonam@github ~ % <tspan class="text-cmd">cat stack.txt</tspan></text>
    
    <!-- Group 1: Languages -->
    <g transform="translate(0, 35)">
      <rect x="0" y="0" width="10" height="10" class="light light-blue" />
      <text x="18" y="10" class="section-title title-lang">LANGUAGES</text>
      
      <!-- Tags -->
      <g transform="translate(0, 20)">
        <rect x="0" y="0" width="60" height="22" class="tag-bg" />
        <text x="30" y="15" text-anchor="middle" class="tag-text">C++</text>
      </g>
      <g transform="translate(70, 20)">
        <rect x="0" y="0" width="75" height="22" class="tag-bg" />
        <text x="37.5" y="15" text-anchor="middle" class="tag-text">Python</text>
      </g>
      <g transform="translate(155, 20)">
        <rect x="0" y="0" width="95" height="22" class="tag-bg" />
        <text x="47.5" y="15" text-anchor="middle" class="tag-text">TypeScript</text>
      </g>
      <g transform="translate(260, 20)">
        <rect x="0" y="0" width="95" height="22" class="tag-bg" />
        <text x="47.5" y="15" text-anchor="middle" class="tag-text">JavaScript</text>
      </g>
    </g>

    <!-- Group 2: AI / ML -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="10" height="10" class="light light-orange" />
      <text x="18" y="10" class="section-title title-ml">AI / MACHINE LEARNING</text>
      
      <!-- Tags -->
      <g transform="translate(0, 20)">
        <rect x="0" y="0" width="80" height="22" class="tag-bg" />
        <text x="40" y="15" text-anchor="middle" class="tag-text">PyTorch</text>
      </g>
      <g transform="translate(90, 20)">
        <rect x="0" y="0" width="105" height="22" class="tag-bg" />
        <text x="52.5" y="15" text-anchor="middle" class="tag-text">Scikit-Learn</text>
      </g>
      <g transform="translate(205, 20)">
        <rect x="0" y="0" width="100" height="22" class="tag-bg" />
        <text x="50" y="15" text-anchor="middle" class="tag-text">LLM Tooling</text>
      </g>
      <g transform="translate(315, 20)">
        <rect x="0" y="0" width="100" height="22" class="tag-bg" />
        <text x="50" y="15" text-anchor="middle" class="tag-text">NumPy/Pandas</text>
      </g>
    </g>

    <!-- Group 3: Web Development -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="10" height="10" class="light light-green" />
      <text x="18" y="10" class="section-title title-web">WEB DEVELOPMENT</text>
      
      <!-- Tags -->
      <g transform="translate(0, 20)">
        <rect x="0" y="0" width="60" height="22" class="tag-bg" />
        <text x="30" y="15" text-anchor="middle" class="tag-text">React</text>
      </g>
      <g transform="translate(70, 20)">
        <rect x="0" y="0" width="70" height="22" class="tag-bg" />
        <text x="35" y="15" text-anchor="middle" class="tag-text">Node.js</text>
      </g>
      <g transform="translate(150, 20)">
        <rect x="0" y="0" width="75" height="22" class="tag-bg" />
        <text x="37.5" y="15" text-anchor="middle" class="tag-text">Express</text>
      </g>
      <g transform="translate(235, 20)">
        <rect x="0" y="0" width="95" height="22" class="tag-bg" />
        <text x="47.5" y="15" text-anchor="middle" class="tag-text">TailwindCSS</text>
      </g>
      <g transform="translate(340, 20)">
        <rect x="0" y="0" width="80" height="22" class="tag-bg" />
        <text x="40" y="15" text-anchor="middle" class="tag-text">MongoDB</text>
      </g>
    </g>

    <!-- Group 4: Developer Tools -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="10" height="10" class="light light-purple" />
      <text x="18" y="10" class="section-title title-dev">INFRASTRUCTURE &amp; TOOLS</text>
      
      <!-- Tags -->
      <g transform="translate(0, 20)">
        <rect x="0" y="0" width="95" height="22" class="tag-bg" />
        <text x="47.5" y="15" text-anchor="middle" class="tag-text">Git / GitHub</text>
      </g>
      <g transform="translate(105, 20)">
        <rect x="0" y="0" width="70" height="22" class="tag-bg" />
        <text x="35" y="15" text-anchor="middle" class="tag-text">Docker</text>
      </g>
      <g transform="translate(180, 20)">
        <rect x="0" y="0" width="60" height="22" class="tag-bg" />
        <text x="30" y="15" text-anchor="middle" class="tag-text">Linux</text>
      </g>
      <g transform="translate(250, 20)">
        <rect x="0" y="0" width="75" height="22" class="tag-bg" />
        <text x="37.5" y="15" text-anchor="middle" class="tag-text">NeoVim</text>
      </g>
    </g>

    <!-- Bottom prompt -->
    <text x="0" y="300" class="text-prompt">sonam@github ~ % <tspan class="text-cmd">_</tspan></text>
  </g>
</svg>
