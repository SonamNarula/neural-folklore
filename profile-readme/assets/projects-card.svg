<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
    .terminal {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }
    .window-bg {
      fill: #1a1b26;
      stroke: #383e5a;
      stroke-width: 1.5;
      rx: 10px;
    }
    .title-bar {
      fill: #16161e;
      stroke: #383e5a;
      stroke-width: 1.5;
      rx: 10px;
    }
    .dot-red { fill: #f7768e; }
    .dot-yellow { fill: #e0af68; }
    .dot-green { fill: #9ece6a; }
    
    .text-title { fill: #a9b1d6; font-size: 13px; font-weight: 500; }
    .text-prompt { fill: #7dcfff; font-size: 14px; font-weight: 500; }
    .text-cmd { fill: #7aa2f7; font-size: 14px; font-weight: 500; }
    
    .panel-bg { fill: #16161e; stroke: #383e5a; stroke-width: 1; rx: 8px; }
    
    .proj-title { font-weight: 700; font-size: 14px; }
    .proj-t1 { fill: #7aa2f7; }
    .proj-t2 { fill: #9ece6a; }
    .proj-t3 { fill: #bb9af7; }
    
    .tag-bg { fill: #1f2335; stroke: #414868; stroke-width: 1; rx: 4px; }
    .tag-text { fill: #a9b1d6; font-size: 10px; }
    
    .meta-label { fill: #565f89; font-size: 10px; font-weight: bold; }
    .meta-val { fill: #c0caf5; font-size: 11px; }
    .desc-text { fill: #a9b1d6; font-size: 11px; }
    .highlight-text { fill: #9ece6a; font-size: 11px; }
    
    .status-active { fill: #9ece6a; font-size: 10px; font-weight: bold; }
    .status-completed { fill: #7dcfff; font-size: 10px; font-weight: bold; }
    .status-maintained { fill: #e0af68; font-size: 10px; font-weight: bold; }
  </style>

  <!-- Background Card -->
  <rect x="1.5" y="1.5" width="857" height="417" class="terminal window-bg" />
  
  <!-- Title Bar -->
  <path d="M 1.5,11.5 A 10,10 0 0 1 11.5,1.5 L 848.5,1.5 A 10,10 0 0 1 858.5,11.5 L 858.5,38 L 1.5,38 Z" class="terminal title-bar" />
  
  <!-- Window Controls -->
  <circle cx="20" cy="19" r="6" class="dot-red" />
  <circle cx="40" cy="19" r="6" class="dot-yellow" />
  <circle cx="60" cy="19" r="6" class="dot-green" />
  
  <!-- Window Title -->
  <text x="430" y="24" text-anchor="middle" class="terminal text-title">sonam@github: ~/projects</text>

  <!-- Content -->
  <g class="terminal" transform="translate(25, 65)">
    <!-- Command Prompt -->
    <text x="0" y="10" class="text-prompt">sonam@github ~ % <tspan class="text-cmd">ls -la ~/projects</tspan></text>
    
    <!-- Project 1 Panel (neural-folklore) -->
    <g transform="translate(0, 30)">
      <rect width="250" height="270" class="panel-bg" />
      <text x="15" y="25" class="proj-title proj-t1">neural-folklore</text>
      <text x="235" y="25" text-anchor="end" class="status-active">[ACTIVE]</text>
      
      <!-- Short Description -->
      <text x="15" y="45" class="desc-text">AI Engineering Public Log</text>
      <text x="15" y="60" class="desc-text">documenting foundation model</text>
      <text x="15" y="75" class="desc-text">tooling &amp; agentic loops.</text>
      
      <!-- Tech Stack -->
      <g transform="translate(15, 90)">
        <rect x="0" y="0" width="50" height="18" class="tag-bg" />
        <text x="25" y="12" text-anchor="middle" class="tag-text">Python</text>
        <rect x="55" y="0" width="70" height="18" class="tag-bg" />
        <text x="90" y="12" text-anchor="middle" class="tag-text">LangChain</text>
        <rect x="130" y="0" width="50" height="18" class="tag-bg" />
        <text x="155" y="12" text-anchor="middle" class="tag-text">RAG</text>
      </g>
      
      <!-- Architecture -->
      <text x="15" y="130" class="meta-label">ARCH:</text>
      <text x="55" y="130" class="meta-val">Agentic Loop / RAG</text>
      
      <!-- Timeline -->
      <text x="15" y="150" class="meta-label">TIME:</text>
      <text x="55" y="150" class="meta-val">2026 - Present</text>
      
      <!-- Highlights -->
      <text x="15" y="180" class="meta-label">KEY HIGHLIGHTS:</text>
      <text x="15" y="200" class="highlight-text">→ Handcrafted agent logic</text>
      <text x="15" y="218" class="highlight-text">→ Custom prompt benchmarks</text>
      <text x="15" y="236" class="highlight-text">→ Model tooling logs</text>
      
      <!-- Repo/Demo Links -->
      <text x="15" y="258" class="tag-text">🔗 GitHub: neural-folklore</text>
    </g>

    <!-- Project 2 Panel (CP Captain & DSA Hub) -->
    <g transform="translate(280, 30)">
      <rect width="250" height="270" class="panel-bg" />
      <text x="15" y="25" class="proj-title proj-t2">CP-Captain Hub</text>
      <text x="235" y="25" text-anchor="end" class="status-maintained">[MAINTAINED]</text>
      
      <!-- Short Description -->
      <text x="15" y="45" class="desc-text">ICPC-style Competitive</text>
      <text x="15" y="60" class="desc-text">Programming templates and</text>
      <text x="15" y="75" class="desc-text">pattern-wise DSA solutions.</text>
      
      <!-- Tech Stack -->
      <g transform="translate(15, 90)">
        <rect x="0" y="0" width="40" height="18" class="tag-bg" />
        <text x="20" y="12" text-anchor="middle" class="tag-text">C++</text>
        <rect x="45" y="0" width="55" height="18" class="tag-bg" />
        <text x="72.5" y="12" text-anchor="middle" class="tag-text">STL</text>
        <rect x="105" y="0" width="60" height="18" class="tag-bg" />
        <text x="135" y="12" text-anchor="middle" class="tag-text">Bash</text>
      </g>
      
      <!-- Architecture -->
      <text x="15" y="130" class="meta-label">ARCH:</text>
      <text x="55" y="130" class="meta-val">Modular STL Templates</text>
      
      <!-- Timeline -->
      <text x="15" y="150" class="meta-label">TIME:</text>
      <text x="55" y="150" class="meta-val">2024 - 2026</text>
      
      <!-- Highlights -->
      <text x="15" y="180" class="meta-label">KEY HIGHLIGHTS:</text>
      <text x="15" y="200" class="highlight-text">→ 488+ LeetCode solved</text>
      <text x="15" y="218" class="highlight-text">→ 20+ core DSA patterns</text>
      <text x="15" y="236" class="highlight-text">→ AtCoder Brown rated</text>
      
      <!-- Repo/Demo Links -->
      <text x="15" y="258" class="tag-text">🔗 GitHub: CP-Captain</text>
    </g>

    <!-- Project 3 Panel (ML Visualization Portal) -->
    <g transform="translate(560, 30)">
      <rect width="250" height="270" class="panel-bg" />
      <text x="15" y="25" class="proj-title proj-t3">ML Dashboard</text>
      <text x="235" y="25" text-anchor="end" class="status-completed">[COMPLETED]</text>
      
      <!-- Short Description -->
      <text x="15" y="45" class="desc-text">Model metrics visualization</text>
      <text x="15" y="60" class="desc-text">and competitive programming</text>
      <text x="15" y="75" class="desc-text">dashboard with API endpoints.</text>
      
      <!-- Tech Stack -->
      <g transform="translate(15, 90)">
        <rect x="0" y="0" width="50" height="18" class="tag-bg" />
        <text x="25" y="12" text-anchor="middle" class="tag-text">React</text>
        <rect x="55" y="0" width="50" height="18" class="tag-bg" />
        <text x="80" y="12" text-anchor="middle" class="tag-text">Node</text>
        <rect x="110" y="0" width="50" height="18" class="tag-bg" />
        <text x="135" y="12" text-anchor="middle" class="tag-text">Chart</text>
      </g>
      
      <!-- Architecture -->
      <text x="15" y="130" class="meta-label">ARCH:</text>
      <text x="55" y="130" class="meta-val">MVC / Client-Server</text>
      
      <!-- Timeline -->
      <text x="15" y="150" class="meta-label">TIME:</text>
      <text x="55" y="150" class="meta-val">2025</text>
      
      <!-- Highlights -->
      <text x="15" y="180" class="meta-label">KEY HIGHLIGHTS:</text>
      <text x="15" y="200" class="highlight-text">→ Real-time API metrics</text>
      <text x="15" y="218" class="highlight-text">→ High-performance graphs</text>
      <text x="15" y="236" class="highlight-text">→ Custom JWT authentication</text>
      
      <!-- Repo/Demo Links -->
      <text x="15" y="258" class="tag-text">🔗 Live: cp-dashboard.io</text>
    </g>

    <!-- Bottom prompt -->
    <text x="0" y="325" class="text-prompt">sonam@github ~ % <tspan class="text-cmd">_</tspan></text>
  </g>
</svg>
