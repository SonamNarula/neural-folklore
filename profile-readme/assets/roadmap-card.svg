<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
    .terminal {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }
    .window-bg {
      fill: #1a1b26;
      stroke: #383e5a;
      stroke-width: 1.5;
      rx: 10px;
    }
    .title-bar {
      fill: #16161e;
      stroke: #383e5a;
      stroke-width: 1.5;
      rx: 10px;
    }
    .dot-red { fill: #f7768e; }
    .dot-yellow { fill: #e0af68; }
    .dot-green { fill: #9ece6a; }
    
    .text-title { fill: #a9b1d6; font-size: 13px; font-weight: 500; }
    .text-prompt { fill: #7dcfff; font-size: 14px; font-weight: 500; }
    .text-cmd { fill: #7aa2f7; font-size: 14px; font-weight: 500; }
    
    /* Roadmap Specific */
    .line-solid { stroke: #7aa2f7; stroke-width: 3; }
    .line-dashed { stroke: #383e5a; stroke-width: 3; stroke-dasharray: 6,4; }
    
    .node-done { fill: #9ece6a; stroke: #1a1b26; stroke-width: 2; }
    .node-active { fill: #ff9e64; stroke: #1a1b26; stroke-width: 2; }
    .node-future { fill: #1a1b26; stroke: #383e5a; stroke-width: 3; }
    
    .text-date { fill: #7dcfff; font-size: 11px; font-weight: bold; }
    .text-phase { fill: #c0caf5; font-size: 12px; font-weight: 700; }
    .text-details { fill: #a9b1d6; font-size: 10px; }
    .text-status { font-size: 9px; font-weight: bold; }
    .status-done { fill: #9ece6a; }
    .status-active { fill: #ff9e64; }
    .status-future { fill: #565f89; }
  </style>

  <!-- Background Card -->
  <rect x="1.5" y="1.5" width="857" height="257" class="terminal window-bg" />
  
  <!-- Title Bar -->
  <path d="M 1.5,11.5 A 10,10 0 0 1 11.5,1.5 L 848.5,1.5 A 10,10 0 0 1 858.5,11.5 L 858.5,38 L 1.5,38 Z" class="terminal title-bar" />
  
  <!-- Window Controls -->
  <circle cx="20" cy="19" r="6" class="dot-red" />
  <circle cx="40" cy="19" r="6" class="dot-yellow" />
  <circle cx="60" cy="19" r="6" class="dot-green" />
  
  <!-- Window Title -->
  <text x="430" y="24" text-anchor="middle" class="terminal text-title">sonam@github: ~/roadmap.md</text>

  <!-- Content -->
  <g class="terminal" transform="translate(25, 65)">
    <!-- Command Prompt -->
    <text x="0" y="10" class="text-prompt">sonam@github ~ % <tspan class="text-cmd">cat roadmap.md</tspan></text>
    
    <!-- Timeline Connections -->
    <!-- Line 1 to 2 -->
    <line x1="100" y1="95" x2="300" y2="95" class="line-solid" />
    <!-- Line 2 to 3 -->
    <line x1="300" y1="95" x2="500" y2="95" class="line-solid" />
    <!-- Line 3 to 4 -->
    <line x1="500" y1="95" x2="700" y2="95" class="line-dashed" />
    
    <!-- Nodes and Details -->
    
    <!-- Phase 1 -->
    <g transform="translate(100, 95)">
      <circle cx="0" cy="0" r="8" class="node-done" />
      <text x="0" y="-35" text-anchor="middle" class="text-date">2024 - 2025</text>
      <text x="0" y="-20" text-anchor="middle" class="text-status status-done">[ COMPLETED ]</text>
      <text x="0" y="25" text-anchor="middle" class="text-phase">CP Foundations</text>
      <text x="0" y="42" text-anchor="middle" class="text-details">488+ LeetCode</text>
      <text x="0" y="57" text-anchor="middle" class="text-details">AtCoder Brown</text>
    </g>

    <!-- Phase 2 -->
    <g transform="translate(300, 95)">
      <circle cx="0" cy="0" r="8" class="node-done" />
      <text x="0" y="-35" text-anchor="middle" class="text-date">Q1 - Q2 2026</text>
      <text x="0" y="-20" text-anchor="middle" class="text-status status-done">[ COMPLETED ]</text>
      <text x="0" y="25" text-anchor="middle" class="text-phase">Full-Stack &amp; ML</text>
      <text x="0" y="42" text-anchor="middle" class="text-details">Python, React</text>
      <text x="0" y="57" text-anchor="middle" class="text-details">NumPy, Pandas</text>
    </g>

    <!-- Phase 3 -->
    <g transform="translate(500, 95)">
      <circle cx="0" cy="0" r="8" class="node-active" />
      <text x="0" y="-35" text-anchor="middle" class="text-date">Q3 - Q4 2026</text>
      <text x="0" y="-20" text-anchor="middle" class="text-status status-active">[ ACTIVE FOCUS ]</text>
      <text x="0" y="25" text-anchor="middle" class="text-phase">Placements &amp; AI</text>
      <text x="0" y="42" text-anchor="middle" class="text-details">Oct '26 Placements</text>
      <text x="0" y="57" text-anchor="middle" class="text-details">LangChain &amp; Agents</text>
    </g>

    <!-- Phase 4 -->
    <g transform="translate(700, 95)">
      <circle cx="0" cy="0" r="7" class="node-future" />
      <text x="0" y="-35" text-anchor="middle" class="text-date">2027+</text>
      <text x="0" y="-20" text-anchor="middle" class="text-status status-future">[ PLANNED ]</text>
      <text x="0" y="25" text-anchor="middle" class="text-phase">Specialized ML</text>
      <text x="0" y="42" text-anchor="middle" class="text-details">Fine-Tuning Models</text>
      <text x="0" y="57" text-anchor="middle" class="text-details">Edge AI Deployments</text>
    </g>

    <!-- Bottom prompt -->
    <text x="-10" y="170" class="text-prompt">sonam@github ~ % <tspan class="text-cmd">_</tspan></text>
  </g>
</svg>
