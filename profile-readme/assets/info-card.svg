<svg xmlns="http://www.w3.org/2000/svg" width="560" height="340" viewBox="0 0 560 340" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
    .terminal {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }
    .window-bg {
      fill: #1a1b26;
      stroke: #383e5a;
      stroke-width: 1.5;
      rx: 10px;
    }
    .title-bar {
      fill: #16161e;
      stroke: #383e5a;
      stroke-width: 1.5;
      rx: 10px;
    }
    .dot-red { fill: #f7768e; }
    .dot-yellow { fill: #e0af68; }
    .dot-green { fill: #9ece6a; }
    
    .text-title { fill: #a9b1d6; font-size: 13px; font-weight: 500; }
    .text-prompt { fill: #7dcfff; font-size: 14px; font-weight: 500; }
    .text-cmd { fill: #7aa2f7; font-size: 14px; font-weight: 500; }
    
    .json-key { fill: #bb9af7; font-size: 13px; font-weight: 500; }
    .json-val { fill: #9ece6a; font-size: 13px; }
    .json-bracket { fill: #e0af68; font-size: 13px; }
    .json-comma { fill: #c0caf5; font-size: 13px; }
    .text-comment { fill: #565f89; font-size: 13px; font-style: italic; }
    
    .cursor {
      fill: #c0caf5;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>

  <!-- Background Card -->
  <rect x="1.5" y="1.5" width="557" height="337" class="terminal window-bg" />
  
  <!-- Title Bar -->
  <path d="M 1.5,11.5 A 10,10 0 0 1 11.5,1.5 L 548.5,1.5 A 10,10 0 0 1 558.5,11.5 L 558.5,38 L 1.5,38 Z" class="terminal title-bar" />
  
  <!-- Window Controls -->
  <circle cx="20" cy="19" r="6" class="dot-red" />
  <circle cx="40" cy="19" r="6" class="dot-yellow" />
  <circle cx="60" cy="19" r="6" class="dot-green" />
  
  <!-- Window Title -->
  <text x="280" y="24" text-anchor="middle" class="terminal text-title">sonam@github: ~</text>

  <!-- Content -->
  <g class="terminal" transform="translate(25, 65)">
    <!-- Command Prompt -->
    <text x="0" y="10" class="text-prompt">sonam@github ~ % <tspan class="text-cmd">whoami --verbose</tspan></text>
    
    <!-- JSON Output -->
    <text x="0" y="40" class="json-bracket">{</text>
    
    <!-- JSON key-values -->
    <text x="20" y="65"><tspan class="json-key">"name"</tspan>: <tspan class="json-val">"Sonam Narula"</tspan><tspan class="json-comma">,</tspan></text>
    
    <text x="20" y="90"><tspan class="json-key">"role"</tspan>: <tspan class="json-val">"Final-Year CSE Undergrad @ JECRC"</tspan><tspan class="json-comma">,</tspan></text>
    
    <text x="20" y="115"><tspan class="json-key">"focus"</tspan>: <tspan class="json-bracket">[</tspan><tspan class="json-val">"AI/ML Development"</tspan><tspan class="json-comma">, </tspan><tspan class="json-val">"Competitive Programming"</tspan><tspan class="json-bracket">]</tspan><tspan class="json-comma">,</tspan></text>
    
    <text x="20" y="140"><tspan class="json-key">"placements"</tspan>: <tspan class="json-val">"Targeting Oct '26 Season"</tspan><tspan class="json-comma">,</tspan></text>
    
    <text x="20" y="165"><tspan class="json-key">"philosophy"</tspan>: <tspan class="json-val">"consistency compounds — 200+ day streaks"</tspan><tspan class="json-comma">,</tspan></text>
    
    <text x="20" y="190"><tspan class="json-key">"current_status"</tspan>: <tspan class="json-val">"Training models, not just solving problems"</tspan><tspan class="json-comma">,</tspan></text>
    
    <text x="20" y="215"><tspan class="json-key">"location"</tspan>: <tspan class="json-val">"Jaipur, India"</tspan></text>
    
    <text x="0" y="240" class="json-bracket">}</text>
    
    <!-- Blinking Cursor -->
    <text x="0" y="270" class="text-prompt">sonam@github ~ % <tspan class="text-cmd">_</tspan></text>
  </g>
</svg>
